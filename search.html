<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поиск — PROBIV.CC</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="topline"></div>
<header class="header"><div class="shell header-row"><div><a href="index.html" class="logo">PROBIV.CC</a><div class="tagline">ПРОВЕРЯЕМ • НЕПРОВЕРЯЕМОЕ • ОБСУЖДАЕМ • НЕОБЫЧНОЕ</div></div><div class="network-ad">ДЕМО-ФОРУМ • ПОИСК</div></div>
<nav class="shell nav"><a data-link-key="forum" href="index.html"><strong>⌂</strong>Форум</a><a data-link-key="profile" href="profile.html?id=1"><strong>♙</strong>Профиль</a><a data-link-key="search" href="search.html"><strong>⌕</strong>Поиск</a><a data-link-key="rules" href="rules.html"><strong>▤</strong>Правила</a><a data-link-key="help" href="help.html"><strong>?</strong>Помощь</a><a data-link-key="admin" href="admin.html"><strong>⚙</strong>Админ</a></nav></header>
<div class="crumb"><span><a href="index.html">PROBIV.CC</a> » Поиск</span><span data-auth></span></div>
<div class="demo-strip shell">ДЕМО · ПОИСК ПО СИНТЕТИЧЕСКОЙ БАЗЕ</div>
<main class="main"><div class="shell"><section class="content"><h1 class="page-title">Поиск по форуму</h1>
<div class="page-panel" style="padding:15px"><div class="search-box">
<input id="s" class="input" placeholder="Название темы, пользователь, категория" autocomplete="off">
<button class="gold-btn" id="searchBtn">Найти</button></div>
<div id="results" style="margin-top:12px"></div></div></section></div></main>
<footer>ДЕМО-ФОРУМ</footer>
<script src="data.js"></script><script src="site.js"></script><script>
(function(){
  const input=document.getElementById("s"),out=document.getElementById("results");
  function go(){
    const query=(input.value||"").toLowerCase().trim();
    if(!query){
      out.innerHTML='<div class="modal-note">Введите поисковый запрос.</div>';
      return;
    }

    const threadHits=(DEMO_DB.threads||[]).filter(function(t){
      const author=displayUser(t.author);
      return (t.title+" "+t.category+" "+author.name+" "+(t.posts||[]).map(function(x){return x.text||""}).join(" ")).toLowerCase().includes(query);
    });
    const userHits=(DEMO_DB.users||[]).filter(function(u){
      return (u.name+" "+u.role+" "+u.status+" "+u.bio).toLowerCase().includes(query);
    });
    const categoryHits=(DEMO_DB.categories||[]).filter(function(c){
      return (c.name+" "+c.description).toLowerCase().includes(query);
    });

    let html="";
    if(threadHits.length){
      html+='<h3>Темы ('+threadHits.length+')</h3>'+threadHits.map(function(t){
        return '<a class="list-row row-link" href="thread.html?id='+encodeURIComponent(t.id)+'"><b>'+esc(t.title)+'</b><div class="meta">'+esc(t.category)+' · автор '+esc(displayUser(t.author).name)+' · '+fmt(t.answers)+' ответов · '+fmt(t.views)+' просмотров</div></a>';
      }).join("");
    }
    if(userHits.length){
      html+='<h3 style="margin-top:14px">Пользователи ('+userHits.length+')</h3>'+userHits.map(function(u){
        return '<a class="list-row row-link" href="'+profileHref(u.id)+'"><b>'+esc(u.name)+'</b><div class="meta">'+esc(u.role)+' · рейтинг '+fmt(u.rating)+' · сообщений '+fmt(u.posts)+'</div></a>';
      }).join("");
    }
    if(categoryHits.length){
      html+='<h3 style="margin-top:14px">Разделы ('+categoryHits.length+')</h3>'+categoryHits.map(function(c){
        return '<a class="list-row row-link" href="category.html?id='+encodeURIComponent(c.id)+'"><b>'+esc(c.name)+'</b><div class="meta">'+esc(c.description||"")+'</div></a>';
      }).join("");
    }

    out.innerHTML=html||'<div class="modal-note">Ничего не найдено.</div>';
  }

  input.value=new URLSearchParams(location.search).get("q")||"";
  document.getElementById("searchBtn").addEventListener("click",go);
  input.addEventListener("keydown",function(e){if(e.key==="Enter")go()});
  go();
  authLinks();
})();
</script>
</body></html>
