<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поиск — PROBIV.CC</title><link rel="stylesheet" href="style.css"></head><body><div class="topline"></div><header class="header"><div class="shell header-row"><div><a href="index.html" class="logo">PROBIV.CC</a><div class="tagline">ПРОВЕРЯЕМ • НЕПРОВЕРЯЕМОЕ • ОБСУЖДАЕМ • НЕОБЫЧНОЕ</div></div><div class="network-ad">ДЕМО-ФОРУМ • ПОИСК</div></div><nav class="shell nav"><a data-link-key="forum" href="index.html"><strong>⌂</strong>Форум</a><a data-link-key="profile" href="profile.html?id=1"><strong>♙</strong>Профиль</a><a data-link-key="search" href="search.html"><strong>⌕</strong>Поиск</a><a data-link-key="rules" href="rules.html"><strong>▤</strong>Правила</a><a data-link-key="help" href="help.html"><strong>?</strong>Помощь</a><a data-link-key="admin" href="admin.html"><strong>⚙</strong>Админ</a></nav></header><div class="crumb"><span><a href="index.html">PROBIV.CC</a> » Поиск</span><span data-auth></span></div><div class="demo-strip shell">ДЕМО · ПОИСК ПО СИНТЕТИЧЕСКОЙ БАЗЕ</div><main class="main"><div class="shell"><section class="content"><h1 class="page-title">Поиск по форуму</h1><div class="page-panel" style="padding:15px"><div class="search-box"><input id="s" class="input" placeholder="Название темы, пользователь, категория"><button class="gold-btn" onclick="go()">Найти</button></div><div id="results" style="margin-top:12px"></div></div></section></div></main><footer>ДЕМО-ФОРУМ</footer><script src="data.js"></script><script src="site.js"></script><script>function go(){const q=(document.getElementById("s").value||"").toLowerCase().trim();const out=document.getElementById("results");if(!q){out.innerHTML='<div class="modal-note">Введите поисковый запрос.</div>';return}const hits=DEMO_DB.threads.filter(t=>(t.title+" "+t.category+" "+(getUser(t.author)?.name||"")+" "+t.posts.map(x=>x.text).join(" ")).toLowerCase().includes(q));out.innerHTML=hits.map(t=>`<div class="list-row" onclick="location.href='thread.html?id=${t.id}'"><b>${esc(t.title)}</b><div class="meta">${esc(t.category)} · автор ${esc(getUser(t.author)?.name||"—")} · ${fmt(t.answers)} ответов · ${fmt(t.views)} просмотров</div></div>`).join("")||"<div class='modal-note'>Ничего не найдено.</div>"}document.getElementById("s").value=new URLSearchParams(location.search).get("q")||"";go();</script></body></html>
