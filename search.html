<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поиск — PROBIV.CC</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="topline"></div>
<header class="header"><div class="shell header-row"><div><a href="index.html" class="logo">PROBIV.CC</a><div class="tagline">ПРОВЕРЯЕМ • НЕПРОВЕРЯЕМОЕ • ОБСУЖДАЕМ • НЕОБЫЧНОЕ</div></div><div class="network-ad">ДЕМО-ФОРУМ • ПОИСК</div></div>
<nav class="shell nav"><a data-link-key="forum" href="index.html"><strong>⌂</strong>Форум</a><a data-link-key="profile" href="profile.html?id=1"><strong>♙</strong>Профиль</a><a data-link-key="search" href="search.html"><strong>⌕</strong>Поиск</a><a data-link-key="rules" href="rules.html"><strong>▤</strong>Правила</a><a data-link-key="help" href="help.html"><strong>?</strong>Помощь</a><a data-link-key="admin" href="admin.html"><strong>⚙</strong>Админ</a></nav></header>
<div class="crumb"><span><a href="index.html">PROBIV.CC</a> » Поиск</span><span data-auth></span></div>
<div class="demo-strip shell">ДЕМО · ПОИСК ПО СИНТЕТИЧЕСКОЙ БАЗЕ</div>
<main class="main"><div class="shell"><section class="content"><h1 class="page-title">Поиск по форуму</h1>
<div class="page-panel" style="padding:15px"><div class="search-box">
<input id="s" class="input" placeholder="Название темы, пользователь, категория" autocomplete="off">
<button class="gold-btn" id="searchBtn">Найти</button></div>
<div id="results" style="margin-top:12px"></div></div></section></div></main>
<footer>ДЕМО-ФОРУМ</footer>
<script src="data.js"></script><script src="site.js"></script><script>
(function(){
  const input=document.getElementById("s"),out=document.getElementById("results");
  const type=new URLSearchParams(location.search).get("type");

  function threadLink(t){
    return '<a class="list-row row-link" href="thread.html?id='+encodeURIComponent(t.id)+'"><b>'+(t.guestAccess==="invite"?"🔒 ":"")+esc(t.title)+'</b><div class="meta">'+esc(t.category)+' · автор '+esc(displayUser(t.author).name)+' · '+fmt(t.answers)+' ответов · '+fmt(t.views)+' просмотров</div></a>';
  }
  function userLink(u){
    return '<a class="list-row row-link" href="'+esc(profileHref(u.id))+'"><b>'+esc(u.name)+'</b><div class="meta">'+esc(u.role||"")+' · рейтинг '+fmt(u.rating)+' · сообщений '+fmt(u.posts)+'</div></a>';
  }
  function catLink(c){
    return '<a class="list-row row-link" href="category.html?id='+encodeURIComponent(c.id)+'"><b>'+esc(c.name)+'</b><div class="meta">'+esc(c.description||"")+'</div></a>';
  }
  function block(title,items,render,first){
    return items.length?'<h3'+(first?'':' style="margin-top:14px"')+'>'+title+' ('+items.length+')</h3>'+items.map(render).join(""):"";
  }

  // Lists opened from the forum-statistics links (search.html?type=...)
  function listByType(){
    const threads=(DEMO_DB.threads||[]).slice().sort(function(a,b){return Number(b.id)-Number(a.id)});
    if(type==="threads"||type==="messages") return block(type==="threads"?"Все темы":"Темы с сообщениями",threads,threadLink,true);
    if(type==="users") return block("Все пользователи",(DEMO_DB.users||[]).slice().sort(function(a,b){return Number(b.id)-Number(a.id)}),userLink,true);
    if(type==="reputation") return block("Пользователи по репутации",(DEMO_DB.users||[]).slice().sort(function(a,b){return (b.rating||0)-(a.rating||0)}),userLink,true);
    return "";
  }

  function go(){
    const query=(input.value||"").toLowerCase().trim();
    if(!query){
      out.innerHTML=listByType()||'<div class="modal-note">Введите поисковый запрос.</div>';
      return;
    }

    const member=isMember()||isPreviewMode();
    const threadHits=(DEMO_DB.threads||[]).filter(function(t){
      const author=displayUser(t.author);
      // Guests must not be able to probe the text of invite-only threads through search.
      const bodies=(t.guestAccess==="invite"&&!member)?"":(t.posts||[]).map(function(x){return x.text||""}).join(" ");
      return ((t.title||"")+" "+(t.category||"")+" "+author.name+" "+bodies).toLowerCase().includes(query);
    });
    const userHits=(DEMO_DB.users||[]).filter(function(u){
      return ((u.name||"")+" "+(u.role||"")+" "+(u.status||"")+" "+(u.bio||"")).toLowerCase().includes(query);
    });
    const categoryHits=(DEMO_DB.categories||[]).filter(function(c){
      return ((c.name||"")+" "+(c.description||"")).toLowerCase().includes(query);
    });

    const html=block("Темы",threadHits,threadLink,true)+block("Пользователи",userHits,userLink,!threadHits.length)+block("Разделы",categoryHits,catLink,!threadHits.length&&!userHits.length);
    out.innerHTML=html||'<div class="modal-note">Ничего не найдено.</div>';
  }

  input.value=new URLSearchParams(location.search).get("q")||"";
  document.getElementById("searchBtn").addEventListener("click",go);
  input.addEventListener("keydown",function(e){if(e.key==="Enter")go()});
  go();
  authLinks();
})();
</script>
</body></html>
