<main class="main"><div class="shell"><section class="content"><div id="threadPage"></div></section></div></main><footer>ДЕМО-ФОРУМ • СИНТЕТИЧЕСКИЕ ДАННЫЕ • НЕ РЕАЛЬНЫЕ ОПЕРАЦИИ</footer>
<script src="data.js"></script><script src="site.js"></script><script>
const t=getThread(q("id"))||DEMO_DB.threads[0];document.title=t.title+" — PROBIV.CC";document.getElementById("crumbCurrent").textContent=t.title;
if(gatePage(t)){
 t.views=(t.views||0)+1;saveDemoDB();
 function renderThread(){
  const before=mediaSlot("threadBefore");
  const after=mediaSlot("threadAfter");
  const posts=t.posts.map((p,i)=>{const u=getUser(p.user);return `<article class="post"><aside class="post-user">${avatar(u,"post-avatar")}<a href="profile.html?id=${u.id}">${esc(u.name)}</a><small>${esc(u.role)}</small><small>Рейтинг: ${fmt(u.rating)}</small><small>Сообщений: ${fmt(u.posts)}</small><small>👍 ${fmt(u.likes)} &nbsp; 👎 ${fmt(u.dislikes)}</small></aside><div class="post-body"><div class="post-meta">${esc(p.date)} <span>#${i+1}</span></div><div class="post-text">${esc(p.text)}</div>${renderMedia(p.mediaIds,"post-media")}<div class="post-actions"><button class="small-btn" onclick="reactToPost(${t.id},${i},'like')">👍 ${p.likes}</button><button class="small-btn" onclick="reactToPost(${t.id},${i},'dislike')">👎 ${p.dislikes}</button><a class="small-btn" href="profile.html?id=${u.id}">Профиль</a></div></div></article>`}).join("");
  document.getElementById("threadPage").innerHTML=`<div class="page-panel"><div class="thread-head"><div class="chips">${esc(t.category)} · ${esc(t.date)}</div><h1>${esc(t.title)}</h1><div class="page-sub">Просмотров: ${fmt(t.views)} · Ответов: ${fmt(t.answers)} · Автор: <a href="profile.html?id=${t.author}">${esc(getUser(t.author).name)}</a></div></div>${before}${renderMedia(t.mediaIds,"thread-media")}${posts}${after}<div class="reply"><b>Ответить</b><textarea id="replyText" placeholder="Напишите демонстрационный ответ..."></textarea><button class="gold-btn" onclick="reply()">Отправить ответ</button></div></div>`;authLinks();
 }
 function reply(){
  if(!isMember()){location.href="login.html?return="+encodeURIComponent(location.href);return}
  const x=document.getElementById("replyText").value.trim();if(!x)return;
  const uid=Number(localStorage.getItem("PROBIV_USER_ID"))||1,u=getUser(uid);
  t.posts.push({user:uid,date:"08.10.2026",text:x,likes:0,dislikes:0});t.answers=(t.answers||0)+1;u.posts=(u.posts||0)+1;DEMO_DB.stats.messages=(DEMO_DB.stats.messages||0)+1;saveDemoDB();renderThread();
 }
 renderThread();
}
</script></body></html>
