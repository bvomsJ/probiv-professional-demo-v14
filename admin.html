@media(max-width:1200px){.ux-admin-shell{grid-template-columns:230px minmax(360px,1fr)!important}.ux-admin-shell .admin-live{grid-column:2;position:static}.ux-admin-shell .ux-panel{grid-column:2}.ux-map-grid{grid-template-columns:1fr}}

</style>

<script src="data.js"></script><script src="site.js"></script><script>
"use strict";
if(typeof requireAdmin!=="function" || !requireAdmin()){throw new Error("ADMIN_AUTH_REQUIRED")}
const rootEl=document.getElementById("adminRoot");
let activeTab="dashboard";
let previewTarget="index.html?preview=1";
let previewTimer=null;
function persist(){saveDB();render();}
function escA(x){return esc(x)}
function btn(txt,fn,cls="small-btn"){return '<button type="button" class="'+cls+'" onclick="'+fn+'">'+txt+'</button>'}
function nav(){
return `<div class="admin-shell"><aside class="admin-nav">
<button data-tab="dashboard">📊 Обзор</button>
<button data-tab="site">⚙️ Сайт</button>
<button data-tab="home">🏠 Главная</button>
<button data-tab="media">🖼️ Медиа / баннеры</button>
<button data-tab="ads">📣 Реклама</button>
<button data-tab="preview">👁️ Живой предпросмотр</button>
<button data-tab="sections">📁 Разделы</button>
<button data-tab="topics">🧵 Темы</button>
<button data-tab="posts">💬 Сообщения</button>
<button data-tab="users">👥 Пользователи</button>
<button data-tab="access">🔐 Доступ</button>
<button data-tab="links">🔗 Ссылки</button>
<button data-tab="pages">📄 Страницы</button>
<button data-tab="tools">🧰 Инструменты</button>
</aside><section class="admin-panel" id="adminPanel"></section><aside class="admin-live"><div class="live-head"><b>👁 Живой просмотр</b><select id="previewTarget" class="input"><option value="index.html?preview=1">Главная</option><option value="category.html?id=1&preview=1">Раздел</option><option value="thread.html?id=101&preview=1">Тема</option><option value="profile.html?id=1&preview=1">Профиль</option></select></div><div class="live-note">Предпросмотр находится прямо рядом с редактором. Поля обновляют его автоматически, без отдельной вкладки.</div><iframe id="liveFrame" title="Живой просмотр" src="${previewTarget}" loading="eager"></iframe></aside></div>`}
function render(){rootEl.innerHTML='<h1 class="page-title">Админ-панель</h1><div class="modal-note"><b>ДЕМО:</b> это локальная панель управления синтетическим форумом. Редактор и живой просмотр работают одновременно.</div>'+nav();document.querySelectorAll("[data-tab]").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.onclick=()=>{activeTab=b.dataset.tab;render()}});const sel=document.getElementById("previewTarget");if(sel){sel.value=previewTarget;sel.onchange=()=>{previewTarget=sel.value;refreshLivePreview(true)}};draw();bindLiveInputs();refreshLivePreview(true)}
function currentPreviewUrl(){return previewTarget||"index.html?preview=1"}
function cloneDB(){return JSON.parse(JSON.stringify(DEMO_DB))}
function syncDraft(){
 const d=cloneDB();
 const v=id=>document.getElementById(id)?.value;
 const n=id=>Number(v(id)||0);
 if(activeTab==="site"){
  d.site.networkAd=v("siteNetwork")??d.site.networkAd; d.site.title=v("siteTitle")??d.site.title; d.site.subtitle=v("siteSubtitle")??d.site.subtitle; d.site.topAd=v("siteTop")??d.site.topAd; d.site.footer=v("siteFooter")??d.site.footer; d.site.demoLabel=v("siteDemo")??d.site.demoLabel; d.site.background=v("siteBg")??d.site.background;
 }
 if(activeTab==="home"){
  d.stats.topics=n("hTopics"); d.stats.messages=n("hMessages"); d.stats.users=n("hUsers"); d.stats.reputation=n("hRep"); d.site.heroBanners=[v("hBanner1")||"",v("hBanner2")||"",v("hBanner3")||""]; d.tagCloud=(v("hTags")||"").split(",").map(x=>x.trim()).filter(Boolean); (d.hotTopics||[]).forEach((x,i)=>{x.title=v("hotT"+i)||x.title;x.tag=v("hotTag"+i)||x.tag;x.views=n("hotViews"+i);x.answers=n("hotAns"+i)});
 }
 if(activeTab==="pages"){
  d.pages=d.pages||{}; d.pages.rules=v("rulesText")??d.pages.rules; d.pages.help=v("helpText")??d.pages.help;
 }
 if(activeTab==="sections"){
  (d.categories||[]).forEach(c=>{c.name=v("cname"+c.id)??c.name;c.description=v("cdesc"+c.id)??c.description;c.topics=n("ctop"+c.id);c.messages=n("cmsg"+c.id)});
 }
 if(activeTab==="users"){
  const id=window.__editingUserId; if(id){const u=d.users.find(x=>x.id===id);if(u){u.name=v("unName")??u.name;u.role=v("unRole")??u.role;u.status=v("unStatus")??u.status;u.avatar=v("unAvatar")??u.avatar;u.color=v("unColor")??u.color;u.joined=v("unJoined")??u.joined;u.rating=n("unRating");u.posts=n("unPosts");u.likes=n("unLikes");u.dislikes=n("unDislikes");u.usdt=n("unUsdt");u.guarant=n("unGuarant");u.deposits=n("unDeposits");u.bio=v("unBio")??u.bio;u.awards=(v("unAwards")||"").split(",").map(x=>x.trim()).filter(Boolean)}}
 }
 if(activeTab==="topics" && window.__editingTopicId){
  const t=d.threads.find(x=>x.id===window.__editingTopicId); if(t){t.title=v("etTitle")??t.title;t.category=v("etCat")??t.category;t.author=n("etAuthor")||t.author;t.date=v("etDate")??t.date;t.views=n("etViews");t.answers=n("etAnswers");t.guestAccess=v("etAccess")??t.guestAccess;t.pinned=!!document.getElementById("etPinned")?.checked;t.mediaIds=Array.from(document.querySelectorAll(".tmedia:checked")).map(z=>z.value);t.posts.forEach((x,i)=>{x.user=n("puser"+i)||x.user;x.date=v("pdate"+i)??x.date;x.text=v("ptext"+i)??x.text;x.likes=n("plike"+i);x.dislikes=n("pdis"+i);x.mediaIds=Array.from(document.querySelectorAll(".pmedia"+i+":checked")).map(z=>z.value)})}
 }
 if(activeTab==="media"){
  (d.media||[]).forEach(m=>{if(document.getElementById("mn"+m.id)){m.name=v("mn"+m.id)||m.name;m.alt=v("ma"+m.id)||"";m.href=v("mh"+m.id)||"";m.enabled=!!document.getElementById("me"+m.id)?.checked}});
 }
 if(activeTab==="ads"){
  (d.ads||[]).forEach(a=>{if(document.getElementById("adn"+a.id)){a.title=v("adn"+a.id)||a.title;a.label=v("adl"+a.id)||"";a.mediaId=v("adm"+a.id)||"";a.position=v("adp"+a.id)||a.position||a.slot||"pageTop";a.slot=a.position;a.width=Math.max(1,Math.min(100,n("adw"+a.id)||100));a.height=Math.max(0,n("adh"+a.id));a.maxWidth=Math.max(0,n("admax"+a.id));a.align=v("ada"+a.id)||"center";a.order=n("ado"+a.id);a.enabled=!!document.getElementById("ade"+a.id)?.checked}});
 }
 sessionStorage.setItem("PROBIV_PREVIEW_DB",JSON.stringify(d));
 return d;
}
function refreshLivePreview(force=false){syncDraft();const f=document.getElementById("liveFrame");if(!f)return;const url=currentPreviewUrl();if(force||f.getAttribute("src")!==url)f.src=url;else{try{f.contentWindow.location.reload()}catch(e){f.src=url}}}
function bindLiveInputs(){document.querySelectorAll("#adminPanel input,#adminPanel textarea,#adminPanel select").forEach(el=>{el.addEventListener("input",queueLivePreview);el.addEventListener("change",queueLivePreview)});const dz=document.getElementById("mediaDrop");if(dz){["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over")}));["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over")}));dz.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(!f)return;const input=document.getElementById("mediaFile");const dt=new DataTransfer();dt.items.add(f);input.files=dt.files;input.dispatchEvent(new Event("change",{bubbles:true}));});}}
function queueLivePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(()=>refreshLivePreview(false),120)}
function panel(){return document.getElementById("adminPanel")}
function draw(){
 const p=panel();
 if(activeTab==="dashboard")drawDashboard(p);
 if(activeTab==="site")drawSite(p);
 if(activeTab==="home")drawHome(p);
 if(activeTab==="media")drawMedia(p);
 if(activeTab==="ads")drawAds(p);
 if(activeTab==="preview")drawPreview(p);
 if(activeTab==="sections")drawSections(p);
 if(activeTab==="topics")drawTopics(p);
 if(activeTab==="posts")drawPosts(p);
 if(activeTab==="users")drawUsers(p);
 if(activeTab==="access")drawAccess(p);
 if(activeTab==="links")drawLinks(p);
 if(activeTab==="pages")drawPages(p);
 if(activeTab==="tools")drawTools(p);
}
function card(title,body){return `<div class="editor-card"><h3>${title}</h3>${body}</div>`}
function field(id,label,val,type="text"){return `<div class="form-row"><label>${label}</label><input id="${id}" class="input" type="${type}" value="${escA(val??"")}"></div>`}
function textarea(id,label,val){return `<div class="form-row"><label>${label}</label><textarea id="${id}" class="textarea">${escA(val??"")}</textarea></div>`}
function drawDashboard(p){
 let open=DEMO_DB.threads.filter(t=>t.guestAccess!=="invite").length,closed=DEMO_DB.threads.length-open;
 p.innerHTML=`<h2>Обзор</h2><div class="stat-grid">
 <div class="stat"><b>${DEMO_DB.threads.length}</b><span>Темы</span></div><div class="stat"><b>${DEMO_DB.threads.reduce((n,t)=>n+t.posts.length,0)}</b><span>Сообщения</span></div>
 <div class="stat"><b>${DEMO_DB.users.length}</b><span>Пользователи</span></div><div class="stat"><b>${closed}</b><span>Закрытые темы</span></div></div>
 ${card("Быстрые действия",`${btn("➕ Создать тему","newTopicForm()","gold-btn")} ${btn("➕ Создать пользователя","newUserForm()","gold-btn")} ${btn("➕ Создать раздел","newSectionForm()","gold-btn")} ${btn("🔗 Настроить ссылки","goTab('links')")} ${btn("♻ Сбросить демо-данные","resetDemo()","small-btn")}`)}
 ${card("Последние темы",DEMO_DB.threads.slice(0,8).map(t=>`<div class="list-row"><b>${escA(t.title)}</b><span class="meta"> #${t.id} · ${t.posts.length} сообщений · ${t.guestAccess==="invite"?"🔒":"🟢"}</span> ${btn("Ред.","editTopic("+t.id+")")}</div>`).join(""))}`}
function goTab(x){activeTab=x;render()}
function drawSite(p){
 p.innerHTML='<h2>Сайт</h2>'+field("siteNetwork","Верхняя плашка",DEMO_DB.site.networkAd||"")+field("siteTitle","Название",DEMO_DB.site.title)+field("siteSubtitle","Подзаголовок",DEMO_DB.site.subtitle)+field("siteTop","Верхний блок",DEMO_DB.site.topAd)+field("siteFooter","Footer",DEMO_DB.site.footer)+field("siteDemo","DEMO-плашка",DEMO_DB.site.demoLabel)+
 '<div class="form-row"><label>Цвет/фон</label><input id="siteBg" class="input" value="'+escA(DEMO_DB.site.background||"background.png")+'"></div><button class="gold-btn" onclick="saveSiteAll()">Сохранить</button>';
}
function saveSiteAll(){DEMO_DB.site.networkAd=document.getElementById("siteNetwork").value;DEMO_DB.site.title=document.getElementById("siteTitle").value;DEMO_DB.site.subtitle=document.getElementById("siteSubtitle").value;DEMO_DB.site.topAd=document.getElementById("siteTop").value;DEMO_DB.site.footer=document.getElementById("siteFooter").value;DEMO_DB.site.demoLabel=document.getElementById("siteDemo").value;DEMO_DB.site.background=document.getElementById("siteBg").value;persist();alert("Сайт сохранён")}
function drawHome(p){
 const tags=(DEMO_DB.tagCloud||["форум","отзывы","обсуждения","гарант","профиль","проверка","демо","рейтинг","новости"]).join(", ");
 p.innerHTML='<h2>Главная</h2>'+field("hTopics","Количество тем",DEMO_DB.stats.topics,"number")+field("hMessages","Количество сообщений",DEMO_DB.stats.messages,"number")+field("hUsers","Количество пользователей",DEMO_DB.stats.users,"number")+field("hRep","Репутация",DEMO_DB.stats.reputation,"number")+field("hBanner1","Баннер 1",DEMO_DB.site.heroBanners?.[0])+field("hBanner2","Баннер 2",DEMO_DB.site.heroBanners?.[1])+field("hBanner3","Баннер 3",DEMO_DB.site.heroBanners?.[2]||"")+textarea("hTags","Облако тегов через запятую",tags)+card("Горячие темы",(DEMO_DB.hotTopics||[]).map((x,i)=>field("hotT"+i,"Заголовок #"+(i+1),x.title)+field("hotTag"+i,"Метка #"+(i+1),x.tag)+field("hotViews"+i,"Просмотры #"+(i+1),x.views,"number")+field("hotAns"+i,"Ответы #"+(i+1),x.answers,"number")).join(""))+`<button class="gold-btn" onclick="saveHome()">Сохранить всё</button>`;
}
function saveHome(){DEMO_DB.stats.topics=+document.getElementById("hTopics").value;DEMO_DB.stats.messages=+document.getElementById("hMessages").value;DEMO_DB.stats.users=+document.getElementById("hUsers").value;DEMO_DB.stats.reputation=+document.getElementById("hRep").value;DEMO_DB.site.heroBanners=[document.getElementById("hBanner1").value,document.getElementById("hBanner2").value,document.getElementById("hBanner3").value];DEMO_DB.tagCloud=document.getElementById("hTags").value.split(",").map(x=>x.trim()).filter(Boolean);(DEMO_DB.hotTopics||[]).forEach((x,i)=>{x.title=document.getElementById("hotT"+i).value;x.tag=document.getElementById("hotTag"+i).value;x.views=+document.getElementById("hotViews"+i).value||0;x.answers=+document.getElementById("hotAns"+i).value||0});persist();alert("Главная сохранена")}
function drawMedia(p){
 const slots=[
  ["topAd","Верхний рекламный блок"],["hero1","Баннер 1"],["hero2","Баннер 2"],
  ["bottom1","Нижний баннер 1"],["bottom2","Нижний баннер 2"],["bottom3","Нижний баннер 3"],["bottom4","Нижний баннер 4"],
  ["sidebar","Боковой баннер"],["globalTop","Верх всех страниц"],["globalBottom","Низ всех страниц"],["threadBefore","Перед сообщениями темы"],["threadAfter","После сообщений темы"]
 ];
 DEMO_DB.site.mediaSlots=DEMO_DB.site.mediaSlots||{};
 const slotOptions=slots.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");
 p.innerHTML='<h2>Медиа / баннеры</h2>'+
 card("Добавить картинку или GIF",`<div class="upload-drop" id="mediaDrop">📥 <b>Перетащи сюда фото или GIF</b><span>или выбери файл ниже</span></div><div class="modal-note">JPG / PNG / WebP / GIF. Файл сохраняется только локально в этом демо.</div><div class="form-row"><label>Файл</label><input id="mediaFile" type="file" class="input" accept="image/*"></div>${field("mediaName","Название","Новый баннер")}${field("mediaAlt","Alt / описание","")}${field("mediaHref","Ссылка при клике (необязательно)","")}<div class="form-row"><label>Размещение</label><select id="mediaSlot" class="input">${slotOptions}<option value="none">Не размещать автоматически</option></select></div><div id="mediaPreview"></div><button class="gold-btn" onclick="addMedia()">➕ Загрузить и добавить</button>`)+
 card("Загруженные медиа",(DEMO_DB.media||[]).map(m=>{let slotsUsed=slots.filter(x=>(DEMO_DB.site.mediaSlots[x[0]]||[]).includes(m.id)).map(x=>x[1]).join(", ");let current=slots.find(x=>(DEMO_DB.site.mediaSlots[x[0]]||[]).includes(m.id));return `<div class="editor-card"><div><b>${escA(m.name)}</b> <span class="meta">${escA(m.type||"")} · ${m.enabled===false?"выкл":"вкл"}</span></div><div class="media-admin-preview"><img src="${escA(m.src)}" alt=""></div><div class="meta">Размещение: ${escA(slotsUsed||"не задано")}</div>${field("mn"+m.id,"Название",m.name)}${field("ma"+m.id,"Alt",m.alt||"")}${field("mh"+m.id,"Ссылка",m.href||"")}<div class="form-row"><label>Слот</label><select id="ms${escA(m.id)}" class="input"><option value="none">Не размещать</option>${slots.map(x=>`<option value="${x[0]}" ${current&&current[0]===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div><label><input type="checkbox" id="me${escA(m.id)}" ${m.enabled!==false?"checked":""}> Включено</label><br>${btn("Сохранить",`saveMedia('${escA(m.id)}')`,"gold-btn")} ${btn("Удалить",`deleteMedia('${escA(m.id)}')`)}</div>`}).join("")||card("Пока пусто","Загрузите первый баннер или GIF."));
}
function addMedia(){
 const f=document.getElementById("mediaFile").files[0]; if(!f)return alert("Выберите картинку или GIF");

function drawUsers(p){p.innerHTML='<h2>Пользователи</h2>'+btn("➕ Создать пользователя","newUserForm()","gold-btn")+DEMO_DB.users.map(u=>card("#"+u.id+" "+escA(u.name),`Роль: ${escA(u.role)} · Рейтинг: ${u.rating} · Сообщений: ${u.posts} · 👍 ${u.likes} 👎 ${u.dislikes}<br>${btn("Редактировать","editUser("+u.id+")","gold-btn")} ${btn("Открыть профиль","location.href='profile.html?id="+u.id+"'")} ${btn("Удалить","deleteUser("+u.id+")")}`)).join("")}
function newUserForm(){window.__editingUserId=null;previewTarget="index.html?preview=1";panel().innerHTML='<h2>Новый пользователь</h2>'+field("nuName","Имя","DemoUser")+field("nuRole","Роль","Участник")+field("nuRating","Рейтинг",0,"number")+field("nuAvatar","Аватар","D")+field("nuColor","Цвет","#65745c")+field("nuJoined","Дата","08.10.2026")+textarea("nuBio","Биография","Синтетический профиль.")+`<button class="gold-btn" onclick="createUser()">Создать пользователя</button>`}
function createUser(){let id=Math.max(0,...DEMO_DB.users.map(x=>x.id))+1,name=document.getElementById("nuName").value.trim();if(!name)return alert("Введите имя");DEMO_DB.users.push({id,name,role:document.getElementById("nuRole").value,rating:+document.getElementById("nuRating").value||0,posts:0,likes:0,dislikes:0,joined:document.getElementById("nuJoined").value,avatar:document.getElementById("nuAvatar").value,color:document.getElementById("nuColor").value,online:false,usdt:0,guarant:0,deposits:0,awards:["Новый участник"],bio:document.getElementById("nuBio").value,status:"Участник"});DEMO_DB.stats.users++;persist();alert("Пользователь создан")}
function editUser(id){let u=getUser(id);window.__editingUserId=id;previewTarget="profile.html?id="+id+"&preview=1";panel().innerHTML='<h2>Пользователь #'+id+'</h2>'+field("unName","Имя",u.name)+field("unRole","Роль",u.role)+field("unStatus","Статус",u.status)+field("unAvatar","Аватар",u.avatar)+field("unColor","Цвет",u.color)+field("unJoined","Дата регистрации",u.joined)+field("unRating","Рейтинг",u.rating,"number")+field("unPosts","Сообщения",u.posts,"number")+field("unLikes","Лайки",u.likes,"number")+field("unDislikes","Дизлайки",u.dislikes,"number")+field("unUsdt","USDT (демо)",u.usdt||0,"number")+field("unGuarant","Гарант (демо)",u.guarant||0,"number")+field("unDeposits","Депозит ₽ (демо)",u.deposits||0,"number")+textarea("unBio","Биография",u.bio)+field("unAwards","Награды через запятую",(u.awards||[]).join(", "))+`<button class="gold-btn" onclick="saveUser("+id+")">Сохранить</button>`}
function saveUser(id){let u=getUser(id);u.name=document.getElementById("unName").value.trim()||u.name;u.role=document.getElementById("unRole").value;u.status=document.getElementById("unStatus").value;u.avatar=document.getElementById("unAvatar").value;u.color=document.getElementById("unColor").value;u.joined=document.getElementById("unJoined").value;u.rating=+document.getElementById("unRating").value||0;u.posts=+document.getElementById("unPosts").value||0;u.likes=+document.getElementById("unLikes").value||0;u.dislikes=+document.getElementById("unDislikes").value||0;u.usdt=+document.getElementById("unUsdt").value||0;u.guarant=+document.getElementById("unGuarant").value||0;u.deposits=+document.getElementById("unDeposits").value||0;u.bio=document.getElementById("unBio").value;u.awards=document.getElementById("unAwards").value.split(",").map(x=>x.trim()).filter(Boolean);persist();alert("Пользователь сохранён")}

function drawAccess(p){p.innerHTML='<h2>Доступ и приглашения</h2>'+DEMO_DB.threads.map(t=>card("#"+t.id+" "+escA(t.title),`<select class="input" onchange="setAccess(${t.id},this.value)"><option value="public" ${t.guestAccess!=="invite"?"selected":""}>Гости могут читать</option><option value="invite" ${t.guestAccess==="invite"?"selected":""}>Только вход / приглашение</option></select>`)).join("")+`<h3>Коды</h3>${(DEMO_DB.invites||[]).map(i=>card(escA(i.code),`${field("iv"+i.code,"Название",i.label)}<label><input type="checkbox" id="ia${i.code}" ${i.active?"checked":""} onchange="toggleInv('${escA(i.code)}')"> Активен</label> ${btn("Удалить","deleteInv('"+escA(i.code)+"')")}`)).join("")}${btn("➕ Новый код","newInvite()","gold-btn")}`}
function setAccess(id,v){getThread(id).guestAccess=v;persist()}
function toggleInv(code){let i=DEMO_DB.invites.find(x=>x.code===code);i.active=!i.active;saveDB();draw()}
function newInvite(){let code=prompt("Код приглашения:");if(!code)return;if(DEMO_DB.invites.some(i=>i.code===code))return alert("Код уже есть");DEMO_DB.invites.push({code,label:"Новое приглашение",active:true,uses:0,maxUses:0});persist()}
function deleteInv(code){DEMO_DB.invites=DEMO_DB.invites.filter(i=>i.code!==code);persist()}
function drawLinks(p){let keys=Object.keys(DEMO_DB.links||{});p.innerHTML='<h2>Все ссылки</h2><div class="modal-note">Любая кнопка/ссылка должна вести на существующую страницу макета или требовать вход.</div>'+keys.map(k=>{let x=DEMO_DB.links[k];return card(escA(k),field("ll"+k,"Текст",x.label)+`<select id="lh${k}" class="input">${["index.html","search.html","rules.html","help.html","login.html","register.html","invite.html","profile.html?id=1","category.html?id=1","thread.html?id=101","admin.html"].map(h=>`<option value="${h}" ${x.href===h?"selected":""}>${h}</option>`).join("")}</select><label><input type="checkbox" id="la${k}" ${x.auth?"checked":""}> Требовать вход</label>`)}).join("")+'<button class="gold-btn" onclick="saveAllLinks()">Сохранить ссылки</button>'}

function drawPages(p){p.innerHTML='<h2>Текстовые страницы</h2>'+card("Правила",textarea("rulesText","Текст",DEMO_DB.pages?.rules||"")+btn("Сохранить","savePage('rules')","gold-btn"))+card("Помощь",textarea("helpText","Текст",DEMO_DB.pages?.help||"")+btn("Сохранить","savePage('help')","gold-btn"))}

function drawTools(p){p.innerHTML='<h2>Инструменты</h2>'+card("Экспорт",btn("Скачать JSON","exportDB()","gold-btn"))+card("Импорт",'<input id="importFile" type="file" accept=".json" class="input"><button class="small-btn" onclick="importDB()">Импортировать</button>')+card("Сброс",'<p>Полностью очистит локальные изменения и вернёт начальные синтетические данные.</p>'+btn("Сбросить","resetDemo()"))}
function exportDB(){let blob=new Blob([JSON.stringify(DEMO_DB,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="probiv-demo-data.json";a.click();URL.revokeObjectURL(a.href)}
function importDB(){let f=document.getElementById("importFile").files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.threads||!x.users)throw 0;localStorage.setItem("PROBIV_DEMO_DB",JSON.stringify(x));location.reload()}catch(e){alert("Неверный JSON")}};r.readAsText(f)}

    if(key==="homeTags") p.innerHTML=info(key,"Теги вводятся через запятую. Например: форум, отзывы, демо, рейтинг")+textarea("hTags","Теги через запятую",(DEMO_DB.tagCloud||[]).join(", "))+`<button class="gold-btn" onclick="saveTagsBlock()">💾 Сохранить теги</button>`;
    if(key==="siteTopAd") p.innerHTML=info(key,"Если меняешь только текст верхнего рекламного блока — сюда. Картинка/GIF для него назначается отдельно через Медиатека → Верхний рекламный блок.")+field("siteTop","Текст верхней рекламы",DEMO_DB.site.topAd)+`<button class="gold-btn" onclick="saveSiteBlock('topAd')">💾 Сохранить верхнюю рекламу</button>`;
    if(key==="siteFooter") p.innerHTML=info(key,"Меняет только текст в самом низу страниц.")+field("siteFooter","Текст подвала",DEMO_DB.site.footer)+`<button class="gold-btn" onclick="saveSiteBlock('footer')">💾 Сохранить подвал</button>`;
    if(key==="siteBackground") p.innerHTML=info(key,"Укажи путь к файлу, например background.png. Для production позже лучше перейти на Storage/медиа.")+field("siteBg","Файл/URL фона",DEMO_DB.site.background||"background.png")+`<button class="gold-btn" onclick="saveSiteBlock('background')">💾 Сохранить фон</button>`;
  }

  function drawFaq(p){
    const faqs=[
      ["Как изменить логотип/название сверху?","Главная → Шапка. Поле «Название сайта»."],["Как изменить текст под логотипом?","Главная → Шапка → «Подзаголовок»."],["Как поменять картинку или GIF?","Медиа → Медиатека. Загрузить файл → выбрать размещение."],["Как поставить GIF именно сверху?","Медиа → Медиатека → Размещение → Верхний рекламный блок или нужный баннер."],["Как поменять размер рекламной картинки?","Медиа и реклама → Рекламные блоки. Там ширина, высота, выравнивание и порядок."],["Как изменить название темы?","Форум → Темы → найти тему → Редактировать."],["Как изменить текст сообщения?","Форум → Темы → открыть тему → изменить нужное сообщение."],["Как поменять профиль пользователя?","Пользователи → Профили → Редактировать."],["Как сделать тему закрытой?","Люди и доступ → Доступ → выбрать тему → вход/приглашение."],["Как изменить кнопку «Помощь» или «Правила»?","Настройки сайта → Ссылки."],["Как изменить страницу правил?","Настройки сайта → Правила и Помощь."],["Где резервная копия?","Настройки сайта → Резервная копия → Экспорт JSON."],["Я не знаю, где находится нужный элемент. Что делать?","Карта сайта → поле поиска. Введи обычными словами: баннер, подвал, тема, профиль, реклама, тег."],["Почему изменение не видно сразу?","Справа находится живой просмотр. Если это сохранённое изменение, нажми сохранить; затем предпросмотр обновится."]
    ];
    p.innerHTML=`<div class="ux-title-row"><div><h2>❓ FAQ — что где менять</h2><p class="ux-muted">Здесь не нужно знать названия файлов. Ищи по тому, что видишь на сайте.</p></div><input id="faqSearch" class="input ux-search" placeholder="🔎 Поиск по вопросу..."></div><div id="faqList" class="ux-faq-list">${faqs.map((f,i)=>`<details class="ux-faq"><summary>${f[0]}</summary><div>${f[1]} <button class="small-btn" onclick="goBlock('${i===0?'homeHeader':i===1?'homeHeader':i===2||i===3?'media':i===4?'ads':i===5||i===6?'topics':i===7?'users':i===8?'access':i===9?'links':i===10?'pages':i===11?'tools':'map'}')">Открыть редактор →</button></div></details>`).join("")}</div>`;
    const s=document.getElementById("faqSearch"), items=document.querySelectorAll(".ux-faq"); s.oninput=()=>{const q=s.value.toLowerCase();items.forEach(x=>x.style.display=!q||x.textContent.toLowerCase().includes(q)?"block":"none")};
  }

  function draw(){
    const p=panel();
    if(activeTab==="map") return drawMap(p);
    if(activeTab==="faq") return drawFaq(p);
    if(blockInfo[activeTab] && ["homeHeader","homeHero","homeStats","homeHot","homeRecent","homeTags","siteTopAd","siteFooter","siteBackground"].includes(activeTab)) return drawBlockSite(p,activeTab);
    if(activeTab==="media") return originalDrawMedia(p);
    if(activeTab==="ads") return originalDrawAds(p);
    if(activeTab==="sections") return originalDrawSections(p);
    if(activeTab==="topics") return originalDrawTopics(p);
    if(activeTab==="posts") return originalDrawPosts(p);
    if(activeTab==="users") return originalDrawUsers(p);
    if(activeTab==="access") return originalDrawAccess(p);
    if(activeTab==="links") return originalDrawLinks(p);
    if(activeTab==="pages") return originalDrawPages(p);
    if(activeTab==="tools") return originalDrawTools(p);
  }

  window.saveSiteBlock=function(kind){
    if(kind==='header'){DEMO_DB.site.title=document.getElementById('siteTitle').value;DEMO_DB.site.subtitle=document.getElementById('siteSubtitle').value;DEMO_DB.site.networkAd=document.getElementById('siteNetwork').value;DEMO_DB.site.demoLabel=document.getElementById('siteDemo').value;}
    if(kind==='topAd') DEMO_DB.site.topAd=document.getElementById('siteTop').value;
    if(kind==='footer') DEMO_DB.site.footer=document.getElementById('siteFooter').value;
    if(kind==='background') DEMO_DB.site.background=document.getElementById('siteBg').value;
    persist(); alert('Готово: блок сохранён.');
  };
  window.saveHeroBlock=function(){DEMO_DB.site.heroBanners=[document.getElementById('hBanner1').value,document.getElementById('hBanner2').value,document.getElementById('hBanner3').value];persist();alert('Баннеры сохранены.');};
  window.saveHomeStatsBlock=function(){DEMO_DB.stats.topics=+document.getElementById('hTopics').value||0;DEMO_DB.stats.messages=+document.getElementById('hMessages').value||0;DEMO_DB.stats.users=+document.getElementById('hUsers').value||0;DEMO_DB.stats.reputation=+document.getElementById('hRep').value||0;persist();alert('Статистика сохранена.');};
  window.saveHomeHotBlock=function(){(DEMO_DB.hotTopics||[]).forEach((x,i)=>{x.title=document.getElementById('hotT'+i).value;x.tag=document.getElementById('hotTag'+i).value;x.views=+document.getElementById('hotViews'+i).value||0;x.answers=+document.getElementById('hotAns'+i).value||0});persist();alert('Горячие темы сохранены.');};
  window.saveRecentBlock=function(){DEMO_DB.recent=DEMO_DB.recent||[];DEMO_DB.recent.forEach((x,i)=>{x.title=document.getElementById('recTitle'+i).value;x.author=+document.getElementById('recAuthor'+i).value||x.author;x.date=document.getElementById('recDate'+i).value;x.answers=+document.getElementById('recAns'+i).value||0;x.pinned=document.getElementById('recPin'+i).checked});persist();alert('Последние темы сохранены.');};
  window.saveTagsBlock=function(){DEMO_DB.tagCloud=(document.getElementById('hTags').value||'').split(',').map(x=>x.trim()).filter(Boolean);persist();alert('Теги сохранены.');};

  // Keep the original preview helpers, but make preview updates safe for the new navigation.
  window.render = render;
  render();
})();
/* ===== V18 END ===== */
</script></body></html>
