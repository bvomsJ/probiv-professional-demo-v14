function refreshLivePreview(force=false){syncDraft();const f=document.getElementById("liveFrame");if(!f)return;const url=currentPreviewUrl();if(force||f.getAttribute("src")!==url)f.src=url;else{try{f.contentWindow.location.reload()}catch(e){f.src=url}}}
function bindLiveInputs(){document.querySelectorAll("#adminPanel input,#adminPanel textarea,#adminPanel select").forEach(el=>{el.addEventListener("input",queueLivePreview);el.addEventListener("change",queueLivePreview)});const dz=document.getElementById("mediaDrop");if(dz){["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over")}));["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over")}));dz.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(!f)return;const input=document.getElementById("mediaFile");const dt=new DataTransfer();dt.items.add(f);input.files=dt.files;input.dispatchEvent(new Event("change",{bubbles:true}));});}}
function queueLivePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(()=>refreshLivePreview(false),120)}

function drawMedia(p){
 const slots=[
  ["topAd","Верхний рекламный блок"],["hero1","Баннер 1"],["hero2","Баннер 2"],
  ["bottom1","Нижний баннер 1"],["bottom2","Нижний баннер 2"],["bottom3","Нижний баннер 3"],["bottom4","Нижний баннер 4"],

function addMedia(){
 const f=document.getElementById("mediaFile").files[0]; if(!f)return alert("Выберите картинку или GIF");
 if(!f.type.startsWith("image/"))return alert("Нужен файл изображения");

 const r=new FileReader(); r.onload=()=>{const id="m"+Date.now()+Math.random().toString(36).slice(2,7); const m={id,name:document.getElementById("mediaName").value.trim()||f.name,alt:document.getElementById("mediaAlt").value.trim(),href:document.getElementById("mediaHref").value.trim(),type:f.type,src:r.result,enabled:true};DEMO_DB.media=DEMO_DB.media||[];DEMO_DB.media.push(m);const slot=document.getElementById("mediaSlot").value;if(slot!=="none"){DEMO_DB.site.mediaSlots=DEMO_DB.site.mediaSlots||{};DEMO_DB.site.mediaSlots[slot]=[...(DEMO_DB.site.mediaSlots[slot]||[]),id];}persist();activeTab="media";alert("Медиа добавлено");draw();bindLiveInputs();refreshLivePreview(true);};r.readAsDataURL(f);
}

function createTopic(){let id=Math.max(0,...DEMO_DB.threads.map(x=>x.id))+1,uid=+document.getElementById("ntAuthor").value,title=document.getElementById("ntTitle").value.trim();if(!title)return alert("Нужен заголовок");let t={id,title,category:document.getElementById("ntCat").value,author:uid,date:document.getElementById("ntDate").value||"08.10.2026",views:0,answers:0,pinned:false,guestAccess:document.getElementById("ntAccess").value,posts:[{user:uid,date:document.getElementById("ntDate").value||"08.10.2026",text:document.getElementById("ntText").value,likes:0,dislikes:0,mediaIds:Array.from(document.querySelectorAll(".ntmedia:checked")).map(z=>z.value)}],mediaIds:[]};DEMO_DB.threads.unshift(t);DEMO_DB.stats.topics++;DEMO_DB.stats.messages++;persist();alert("Тема создана")}
function editTopic(id){let t=getThread(id);if(!t)return;window.__editingTopicId=id;previewTarget="thread.html?id="+id+"&preview=1";panel().innerHTML='<h2>Тема #'+id+'</h2>'+field("etTitle","Заголовок",t.title)+`<div class="form-row"><label>Раздел</label><select id="etCat" class="input">${DEMO_DB.categories.map(c=>`<option ${c.name===t.category?"selected":""}>${escA(c.name)}</option>`).join("")}</select></div>`+`<div class="form-row"><label>Автор</label><select id="etAuthor" class="input">${DEMO_DB.users.map(u=>`<option value="${u.id}" ${u.id===t.author?"selected":""}>${escA(u.name)}</option>`).join("")}</select></div>`+field("etDate","Дата",t.date)+field("etViews","Просмотры",t.views,"number")+field("etAnswers","Ответы",t.answers,"number")+`<div class="form-row"><label>Доступ</label><select id="etAccess" class="input"><option value="public" ${t.guestAccess!=="invite"?"selected":""}>Гости</option><option value="invite" ${t.guestAccess==="invite"?"selected":""}>Вход / приглашение</option></select></div>`+`<div class="form-row"><label><input id="etPinned" type="checkbox" ${t.pinned?"checked":""}> Закрепить</label></div>`+`<div class="form-row"><label>Медиа над темой</label><div>${(DEMO_DB.media||[]).map(m=>`<label style="display:block"><input class="tmedia" type="checkbox" value="${escA(m.id)}" ${(t.mediaIds||[]).includes(m.id)?"checked":""}> ${escA(m.name)}</label>`).join("")||"Нет загруженных медиа"}</div></div><h3>Сообщения</h3><div id="topicPosts">${t.posts.map((x,i)=>postEditor(t,i,x)).join("")}</div>`+btn("➕ Добавить сообщение","addPost("+id+")","gold-btn")+" "+btn("Сохранить тему","saveTopic("+id+")","gold-btn")+" "+btn("Удалить тему","deleteTopic("+id+")")+`<div class="modal-note">Можно менять автора, текст, реакции, дату и порядок сообщений.</div>`}
function postEditor(t,i,x){let u=getUser(x.user)||{};const mids=x.mediaIds||[];return `<div class="editor-card"><b>Сообщение #${i+1}</b><div class="form-row"><label>Автор</label><select id="puser${i}" class="input">${DEMO_DB.users.map(u=>`<option value="${u.id}" ${u.id===x.user?"selected":""}>${escA(u.name)}</option>`).join("")}</select></div>${field("pdate"+i,"Дата",x.date)}${textarea("ptext"+i,"Текст",x.text)}${field("plike"+i,"Лайки",x.likes||0,"number")}${field("pdis"+i,"Дизлайки",x.dislikes||0,"number")}<div class="form-row"><label>Картинки/GIF в сообщении</label><div>${(DEMO_DB.media||[]).map(m=>`<label style="display:block"><input class="pmedia${i}" type="checkbox" value="${escA(m.id)}" ${mids.includes(m.id)?"checked":""}> ${escA(m.name)}</label>`).join("")||"Нет загруженных медиа"}</div></div>${btn("Удалить сообщение","removePost("+t.id+","+i+")")}</div>`}
function saveTopic(id){let t=getThread(id);t.title=document.getElementById("etTitle").value.trim()||t.title;t.category=document.getElementById("etCat").value;t.author=+document.getElementById("etAuthor").value;t.date=document.getElementById("etDate").value;t.views=Math.max(0,+document.getElementById("etViews").value||0);t.answers=Math.max(0,+document.getElementById("etAnswers").value||0);t.guestAccess=document.getElementById("etAccess").value;t.pinned=document.getElementById("etPinned").checked;t.mediaIds=Array.from(document.querySelectorAll(".tmedia:checked")).map(z=>z.value);t.posts.forEach((x,i)=>{x.user=+document.getElementById("puser"+i).value;x.date=document.getElementById("pdate"+i).value;x.text=document.getElementById("ptext"+i).value;x.likes=Math.max(0,+document.getElementById("plike"+i).value||0);x.dislikes=Math.max(0,+document.getElementById("pdis"+i).value||0);x.mediaIds=Array.from(document.querySelectorAll(".pmedia"+i+":checked")).map(z=>z.value)});persist();alert("Тема и сообщения сохранены")}
function addPost(id){let t=getThread(id),uid=Number(DEMO_DB.users[0].id);t.posts.push({user:uid,date:"08.10.2026",text:"Новое демонстрационное сообщение.",likes:0,dislikes:0});t.answers=t.posts.length-1;saveDB();editTopic(id)}
function removePost(id,i){let t=getThread(id);if(t.posts.length<=1)return alert("В теме должно остаться хотя бы одно сообщение");t.posts.splice(i,1);t.answers=t.posts.length-1;persist();editTopic(id)}
function deleteTopic(id){if(!confirm("Удалить тему и все её сообщения?"))return;DEMO_DB.threads=DEMO_DB.threads.filter(t=>t.id!==id);DEMO_DB.stats.topics=Math.max(0,DEMO_DB.stats.topics-1);persist()}

function drawUsers(p){p.innerHTML='<h2>Пользователи</h2>'+btn("➕ Создать пользователя","newUserForm()","gold-btn")+DEMO_DB.users.map(u=>card("#"+u.id+" "+escA(u.name),`Роль: ${escA(u.role)} · Рейтинг: ${u.rating} · Сообщений: ${u.posts} · 👍 ${u.likes} 👎 ${u.dislikes}<br>${btn("Редактировать","editUser("+u.id+")","gold-btn")} ${btn("Открыть профиль","location.href='profile.html?id="+u.id+"'")} ${btn("Удалить","deleteUser("+u.id+")")}`)).join("")}
function newUserForm(){window.__editingUserId=null;previewTarget="index.html?preview=1";panel().innerHTML='<h2>Новый пользователь</h2>'+field("nuName","Имя","DemoUser")+field("nuRole","Роль","Участник")+field("nuRating","Рейтинг",0,"number")+field("nuAvatar","Аватар","D")+field("nuColor","Цвет","#65745c")+field("nuJoined","Дата","08.10.2026")+textarea("nuBio","Биография","Синтетический профиль.")+`<button class="gold-btn" onclick="createUser()">Создать пользователя</button>`}
function createUser(){let id=Math.max(0,...DEMO_DB.users.map(x=>x.id))+1,name=document.getElementById("nuName").value.trim();if(!name)return alert("Введите имя");DEMO_DB.users.push({id,name,role:document.getElementById("nuRole").value,rating:+document.getElementById("nuRating").value||0,posts:0,likes:0,dislikes:0,joined:document.getElementById("nuJoined").value,avatar:document.getElementById("nuAvatar").value,color:document.getElementById("nuColor").value,online:false,usdt:0,guarant:0,deposits:0,awards:["Новый участник"],bio:document.getElementById("nuBio").value,status:"Участник"});DEMO_DB.stats.users++;persist();alert("Пользователь создан")}
function editUser(id){let u=getUser(id);window.__editingUserId=id;previewTarget="profile.html?id="+id+"&preview=1";panel().innerHTML='<h2>Пользователь #'+id+'</h2>'+field("unName","Имя",u.name)+field("unRole","Роль",u.role)+field("unStatus","Статус",u.status)+field("unAvatar","Аватар",u.avatar)+field("unColor","Цвет",u.color)+field("unJoined","Дата регистрации",u.joined)+field("unRating","Рейтинг",u.rating,"number")+field("unPosts","Сообщения",u.posts,"number")+field("unLikes","Лайки",u.likes,"number")+field("unDislikes","Дизлайки",u.dislikes,"number")+field("unUsdt","USDT (демо)",u.usdt||0,"number")+field("unGuarant","Гарант (демо)",u.guarant||0,"number")+field("unDeposits","Депозит ₽ (демо)",u.deposits||0,"number")+textarea("unBio","Биография",u.bio)+field("unAwards","Награды через запятую",(u.awards||[]).join(", "))+`<button class="gold-btn" onclick="saveUser("+id+")">Сохранить</button>`}
function saveUser(id){let u=getUser(id);u.name=document.getElementById("unName").value.trim()||u.name;u.role=document.getElementById("unRole").value;u.status=document.getElementById("unStatus").value;u.avatar=document.getElementById("unAvatar").value;u.color=document.getElementById("unColor").value;u.joined=document.getElementById("unJoined").value;u.rating=+document.getElementById("unRating").value||0;u.posts=+document.getElementById("unPosts").value||0;u.likes=+document.getElementById("unLikes").value||0;u.dislikes=+document.getElementById("unDislikes").value||0;u.usdt=+document.getElementById("unUsdt").value||0;u.guarant=+document.getElementById("unGuarant").value||0;u.deposits=+document.getElementById("unDeposits").value||0;u.bio=document.getElementById("unBio").value;u.awards=document.getElementById("unAwards").value.split(",").map(x=>x.trim()).filter(Boolean);persist();alert("Пользователь сохранён")}
function deleteUser(id){if(DEMO_DB.users.length<=1)return alert("Нельзя удалить последнего пользователя");if(!confirm("Удалить пользователя? Его сообщения останутся с прежним ID автора."))return;DEMO_DB.users=DEMO_DB.users.filter(u=>u.id!==id);DEMO_DB.stats.users=Math.max(0,DEMO_DB.stats.users-1);persist()}
function drawAccess(p){p.innerHTML='<h2>Доступ и приглашения</h2>'+DEMO_DB.threads.map(t=>card("#"+t.id+" "+escA(t.title),`<select class="input" onchange="setAccess(${t.id},this.value)"><option value="public" ${t.guestAccess!=="invite"?"selected":""}>Гости могут читать</option><option value="invite" ${t.guestAccess==="invite"?"selected":""}>Только вход / приглашение</option></select>`)).join("")+`<h3>Коды</h3>${(DEMO_DB.invites||[]).map(i=>card(escA(i.code),`${field("iv"+i.code,"Название",i.label)}<label><input type="checkbox" id="ia${i.code}" ${i.active?"checked":""} onchange="toggleInv('${escA(i.code)}')"> Активен</label> ${btn("Удалить","deleteInv('"+escA(i.code)+"')")}`)).join("")}${btn("➕ Новый код","newInvite()","gold-btn")}`}
function setAccess(id,v){getThread(id).guestAccess=v;persist()}
function toggleInv(code){let i=DEMO_DB.invites.find(x=>x.code===code);i.active=!i.active;saveDB();draw()}
function newInvite(){let code=prompt("Код приглашения:");if(!code)return;if(DEMO_DB.invites.some(i=>i.code===code))return alert("Код уже есть");DEMO_DB.invites.push({code,label:"Новое приглашение",active:true,uses:0,maxUses:0});persist()}
function deleteInv(code){DEMO_DB.invites=DEMO_DB.invites.filter(i=>i.code!==code);persist()}
function drawLinks(p){let keys=Object.keys(DEMO_DB.links||{});p.innerHTML='<h2>Все ссылки</h2><div class="modal-note">Любая кнопка/ссылка должна вести на существующую страницу макета или требовать вход.</div>'+keys.map(k=>{let x=DEMO_DB.links[k];return card(escA(k),field("ll"+k,"Текст",x.label)+`<select id="lh${k}" class="input">${["index.html","search.html","rules.html","help.html","login.html","register.html","invite.html","profile.html?id=1","category.html?id=1","thread.html?id=101","admin.html"].map(h=>`<option value="${h}" ${x.href===h?"selected":""}>${h}</option>`).join("")}</select><label><input type="checkbox" id="la${k}" ${x.auth?"checked":""}> Требовать вход</label>`)}).join("")+'<button class="gold-btn" onclick="saveAllLinks()">Сохранить ссылки</button>'}
function saveAllLinks(){Object.keys(DEMO_DB.links).forEach(k=>{DEMO_DB.links[k].label=document.getElementById("ll"+k).value;DEMO_DB.links[k].href=document.getElementById("lh"+k).value;DEMO_DB.links[k].auth=document.getElementById("la"+k).checked});persist();alert("Ссылки сохранены")}
function drawPages(p){p.innerHTML='<h2>Текстовые страницы</h2>'+card("Правила",textarea("rulesText","Текст",DEMO_DB.pages?.rules||"")+btn("Сохранить","savePage('rules')","gold-btn"))+card("Помощь",textarea("helpText","Текст",DEMO_DB.pages?.help||"")+btn("Сохранить","savePage('help')","gold-btn"))}
function savePage(k){DEMO_DB.pages=DEMO_DB.pages||{};DEMO_DB.pages[k]=document.getElementById(k+"Text").value;persist();alert("Страница сохранена")}
function drawTools(p){p.innerHTML='<h2>Инструменты</h2>'+card("Экспорт",btn("Скачать JSON","exportDB()","gold-btn"))+card("Импорт",'<input id="importFile" type="file" accept=".json" class="input"><button class="small-btn" onclick="importDB()">Импортировать</button>')+card("Сброс",'<p>Полностью очистит локальные изменения и вернёт начальные синтетические данные.</p>'+btn("Сбросить","resetDemo()"))}
function exportDB(){let blob=new Blob([JSON.stringify(DEMO_DB,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="probiv-demo-data.json";a.click();URL.revokeObjectURL(a.href)}
function importDB(){let f=document.getElementById("importFile").files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.threads||!x.users)throw 0;localStorage.setItem("PROBIV_DEMO_DB",JSON.stringify(x));location.reload()}catch(e){alert("Неверный JSON")}};r.readAsText(f)}
function resetDemo(){if(!confirm("Вернуть исходные данные?"))return;localStorage.removeItem("PROBIV_DEMO_DB");localStorage.removeItem("PROBIV_DB_VERSION");location.reload()}
render();
</script></body></html>
