function saveHomeLists(){
  (DEMO_DB.recent||[]).forEach(function(x,i){
    x.title=document.getElementById('hrTitle'+i)?.value.trim()||x.title;
    const threadValue=document.getElementById('hrThread'+i)?.value||'';
    x.threadId=threadValue?Number(threadValue):undefined;
    x.author=Number(document.getElementById('hrAuthor'+i)?.value||x.author);
    x.date=document.getElementById('hrDate'+i)?.value||x.date;
    x.answers=Number(document.getElementById('hrAnswers'+i)?.value||0);
    x.pinned=!!document.getElementById('hrPinned'+i)?.checked;
  });
  persist();
  alert('Список последних сообщений сохранён');
}
function addRecentEntry(){
  DEMO_DB.recent=DEMO_DB.recent||[];
  DEMO_DB.recent.push({title:'Новая строка',author:Number(DEMO_DB.users[0]?.id)||1,date:'Сегодня',answers:0,pinned:false});
  persist();
}
function deleteRecentEntry(i){
  if(!confirm('Удалить строку из списка «Новые сообщения»?'))return;
  DEMO_DB.recent.splice(i,1);
  persist();
}

      (DEMO_DB.recent||[]).forEach(function(x){if(x.category===oldName)x.category=next});

}

 ];

async function addMedia(){
 const f=document.getElementById("mediaFile").files[0]; if(!f)return alert("Выберите картинку или GIF");
 if(!f.type.startsWith("image/"))return alert("Нужен файл изображения");
 if(f.size>10*1024*1024)return alert("Максимальный размер файла — 10 МБ.");

function saveSection(id){
  const c=DEMO_DB.categories.find(function(x){return x.id===id});
  if(!c)return;
  const oldName=c.name;
  const next=document.getElementById("cname"+id).value.trim()||oldName;
  if((DEMO_DB.categories||[]).some(function(x){return x.id!==id&&x.name.toLowerCase()===next.toLowerCase()}))return alert("Раздел с таким названием уже существует");
  c.name=next;
  c.description=document.getElementById("cdesc"+id).value;
  c.topics=Number(document.getElementById("ctop"+id).value||0);
  c.messages=Number(document.getElementById("cmsg"+id).value||0);
  if(oldName!==next){
    (DEMO_DB.threads||[]).forEach(function(t){if(t.category===oldName)t.category=next});
  }
  persist();alert("Раздел сохранён")
}
function deleteSection(id){
  if(DEMO_DB.categories.length<=1)return alert("Нельзя удалить последний раздел");
  const c=DEMO_DB.categories.find(function(x){return x.id===id});
  if(!c)return;
  const threads=(DEMO_DB.threads||[]).filter(function(t){return t.category===c.name});
  if(threads.length){
    const target=DEMO_DB.categories.find(function(x){return x.id!==id});
    if(!target)return alert("Нет раздела для переноса тем");
    if(!confirm("В разделе есть темы. Удалить раздел и перенести темы в «"+target.name+"»?"))return;
    threads.forEach(function(t){t.category=target.name});
  }
  DEMO_DB.categories=DEMO_DB.categories.filter(function(x){return x.id!==id});
  persist();
  alert("Раздел удалён");
}

function createSection(){
  const name=document.getElementById("newSecName").value.trim();
  if(!name)return alert("Введите название раздела");
  if(DEMO_DB.categories.some(function(x){return x.name.toLowerCase()===name.toLowerCase()}))return alert("Такой раздел уже существует");
  const id=Math.max(0,...DEMO_DB.categories.map(function(x){return Number(x.id)||0}))+1;
  DEMO_DB.categories.push({id:id,name:name,description:document.getElementById("newSecDesc").value.trim(),topics:0,messages:0,section:"Новые"});
  persist();
  alert("Раздел создан");
}

async function createTopic(){
  const before=JSON.parse(JSON.stringify(DEMO_DB));
  const ids=(DEMO_DB.threads||[]).map(function(x){return Number(x.id)||0});
  // Use a timestamp-based numeric ID so a hidden/restricted topic cannot collide with the visible list.
  const id=Math.max(Date.now(), (ids.length?Math.max.apply(null,ids):100)+1);
  const uid=Number(document.getElementById("ntAuthor").value);
  const title=document.getElementById("ntTitle").value.trim();
  const category=document.getElementById("ntCat").value;
  if(!title)return alert("Нужен заголовок");
  if(!category)return alert("Выберите раздел");
  if((DEMO_DB.threads||[]).some(function(t){return t.title.trim().toLowerCase()===title.toLowerCase()}))return alert("Тема с таким названием уже существует");
  const date=document.getElementById("ntDate").value||todayStr();
  const posts=[{user:uid,date:date,text:document.getElementById("ntText").value,likes:0,dislikes:0,reactions:{},mediaIds:Array.from(document.querySelectorAll(".ntmedia:checked")).map(function(z){return z.value})}];
  const t={id:id,title:title,category:category,author:uid,date:date,views:0,answers:0,pinned:false,guestAccess:document.getElementById("ntAccess").value,posts:posts,mediaIds:[]};
  DEMO_DB.threads.unshift(t);
  DEMO_DB.stats.topics=Math.max(0,Number(DEMO_DB.stats.topics)||0)+1;
  DEMO_DB.stats.messages=Math.max(0,Number(DEMO_DB.stats.messages)||0)+1;
  const u=getUser(uid);if(u)u.posts=Math.max(0,Number(u.posts)||0)+1;
  const c=DEMO_DB.categories.find(function(x){return x.name===category});if(c){c.topics=(Number(c.topics)||0)+1;c.messages=(Number(c.messages)||0)+1;}
  const result=await persist();
  if(!result?.ok){window.DEMO_DB=before;render();alert("Тема не сохранена в Supabase: "+(result?.reason||"ошибка сохранения"));return;}
  const verified=await window.SupabaseAdapter.verifyTopic(id,t.guestAccess,title);
  if(!verified.ok){
    alert("Сохранение не подтверждено Supabase: "+verified.reason+"\nТема не будет считаться опубликованной.");
    return;
  }
  const reload=await window.SupabaseAdapter.refreshState();
  if(!reload.ok){alert("Тема записана, но не удалось обновить данные с сервера: "+reload.reason);return;}
  alert(t.guestAccess==="invite"?"Тема сохранена. Доступ ограничен пользователями с авторизацией Supabase.":"Тема сохранена и доступна гостям.");goTab("topics");
}
function editTopic(id){let t=getThread(id);if(!t)return;window.__editingTopicId=id;previewTarget="thread.html?id="+id+"&preview=1";panel().innerHTML='<h2>Тема #'+id+'</h2>'+field("etTitle","Заголовок",t.title)+`<div class="form-row"><label>Раздел</label><select id="etCat" class="input">${DEMO_DB.categories.map(c=>`<option ${c.name===t.category?"selected":""}>${escA(c.name)}</option>`).join("")}</select></div>`+`<div class="form-row"><label>Автор</label><select id="etAuthor" class="input">${DEMO_DB.users.map(u=>`<option value="${u.id}" ${u.id===t.author?"selected":""}>${escA(u.name)}</option>`).join("")}</select></div>`+field("etDate","Дата",t.date)+field("etViews","Просмотры",t.views,"number")+field("etAnswers","Ответы",t.answers,"number")+`<div class="form-row"><label>Доступ</label><select id="etAccess" class="input"><option value="public" ${t.guestAccess!=="invite"?"selected":""}>Гости</option><option value="invite" ${t.guestAccess==="invite"?"selected":""}>Вход / приглашение</option></select></div>`+`<div class="form-row"><label><input id="etPinned" type="checkbox" ${t.pinned?"checked":""}> Закрепить</label></div>`+`<div class="form-row"><label>Медиа над темой</label><div>${(DEMO_DB.media||[]).map(m=>`<label style="display:block"><input class="tmedia" type="checkbox" value="${escA(m.id)}" ${(t.mediaIds||[]).includes(m.id)?"checked":""}> ${escA(m.name)}</label>`).join("")||"Нет загруженных медиа"}</div></div><h3>Сообщения</h3><div id="topicPosts">${t.posts.map((x,i)=>postEditor(t,i,x)).join("")}</div>`+btn("➕ Добавить сообщение","addPost("+id+")","gold-btn")+" "+btn("Сохранить тему","saveTopic("+id+")","gold-btn")+" "+btn("Удалить тему","deleteTopic("+id+")")+`<div class="modal-note">Можно менять автора, текст, реакции, дату и порядок сообщений.</div>`}
function postEditor(t,i,x){let u=getUser(x.user)||{};const mids=x.mediaIds||[];return `<div class="editor-card"><b>Сообщение #${i+1}</b><div class="form-row"><label>Автор</label><select id="puser${i}" class="input">${DEMO_DB.users.map(u=>`<option value="${u.id}" ${u.id===x.user?"selected":""}>${escA(u.name)}</option>`).join("")}</select></div>${field("pdate"+i,"Дата",x.date)}${textarea("ptext"+i,"Текст",x.text)}${field("plike"+i,"Лайки",x.likes||0,"number")}${field("pdis"+i,"Дизлайки",x.dislikes||0,"number")}<div class="form-row"><label>Картинки/GIF в сообщении</label><div>${(DEMO_DB.media||[]).map(m=>`<label style="display:block"><input class="pmedia${i}" type="checkbox" value="${escA(m.id)}" ${mids.includes(m.id)?"checked":""}> ${escA(m.name)}</label>`).join("")||"Нет загруженных медиа"}</div></div>${btn("Удалить сообщение","removePost("+t.id+","+i+")")}</div>`}
async function saveTopic(id){let t=getThread(id);t.title=document.getElementById("etTitle").value.trim()||t.title;t.category=document.getElementById("etCat").value;t.author=+document.getElementById("etAuthor").value;t.date=document.getElementById("etDate").value;t.views=Math.max(0,+document.getElementById("etViews").value||0);t.answers=Math.max(0,+document.getElementById("etAnswers").value||0);t.guestAccess=document.getElementById("etAccess").value;t.pinned=document.getElementById("etPinned").checked;t.mediaIds=Array.from(document.querySelectorAll(".tmedia:checked")).map(z=>z.value);t.posts.forEach((x,i)=>{x.user=+document.getElementById("puser"+i).value;x.date=document.getElementById("pdate"+i).value;x.text=document.getElementById("ptext"+i).value;x.likes=Math.max(0,+document.getElementById("plike"+i).value||0);x.dislikes=Math.max(0,+document.getElementById("pdis"+i).value||0);x.mediaIds=Array.from(document.querySelectorAll(".pmedia"+i+":checked")).map(z=>z.value)});persist();const result=await window.__supabasePersistPromise;if(!result?.ok){alert("Не удалось сохранить тему в Supabase: "+(result?.reason||"ошибка сохранения"));return}const verified=await window.SupabaseAdapter.verifyTopic(id,t.guestAccess,t.title);if(!verified.ok){alert("Сохранение не подтверждено Supabase: "+verified.reason);return;}alert(t.guestAccess==="invite"?"Тема и сообщения сохранены. Доступ только авторизованным.":"Тема и сообщения сохранены. Доступ открыт гостям.")}
function addPost(id){
  const t=getThread(id),u=DEMO_DB.users[0];
  if(!t||!u)return;
  t.posts=t.posts||[];
  t.posts.push({user:Number(u.id),date:todayStr(),text:"Новое демонстрационное сообщение.",likes:0,dislikes:0,reactions:{},mediaIds:[]});
  t.answers=Math.max(0,t.posts.length-1);
  DEMO_DB.stats.messages=Math.max(0,Number(DEMO_DB.stats.messages)||0)+1;
  u.posts=Math.max(0,Number(u.posts)||0)+1;

}
function removePost(id,i){
  const t=getThread(id);
  if(!t||t.posts.length<=1)return alert("В теме должно остаться хотя бы одно сообщение");
  const removed=t.posts[i];
  t.posts.splice(i,1);
  t.answers=Math.max(0,t.posts.length-1);
  const u=getUser(removed?.user);
  if(u)u.posts=Math.max(0,Number(u.posts)||0)-1;
  DEMO_DB.stats.messages=Math.max(0,Number(DEMO_DB.stats.messages)||0)-1;
  persist();
  editTopic(id);
}
function deleteTopic(id){
  const t=getThread(id);if(!t)return;
  if(!confirm("Удалить тему и все её сообщения?"))return;
  const postCount=(t.posts||[]).length;
  (t.posts||[]).forEach(function(p){const u=getUser(p.user);if(u)u.posts=Math.max(0,Number(u.posts)||0)-1;});
  const c=DEMO_DB.categories.find(function(x){return x.name===t.category});
  if(c){c.topics=Math.max(0,Number(c.topics||0)-1);c.messages=Math.max(0,Number(c.messages||0)-postCount);}
  DEMO_DB.threads=DEMO_DB.threads.filter(function(x){return Number(x.id)!==Number(id)});
  DEMO_DB.recent=(DEMO_DB.recent||[]).filter(function(x){return Number(x.threadId)!==Number(id)&&x.title!==t.title});
  DEMO_DB.stats.topics=Math.max(0,Number(DEMO_DB.stats.topics||0)-1);
  DEMO_DB.stats.messages=Math.max(0,Number(DEMO_DB.stats.messages||0)-postCount);
  persist();
  alert("Тема удалена");
}
function cloneTopic(id){
  const t=getThread(id);if(!t)return;
  const copy=JSON.parse(JSON.stringify(t));
  copy.id=Math.max(0,...DEMO_DB.threads.map(function(x){return Number(x.id)||0}))+1;
  copy.title+=" (копия)";
  copy.views=0;
  copy.answers=Math.max(0,(copy.posts||[]).length-1);
  DEMO_DB.threads.unshift(copy);
  DEMO_DB.stats.topics=Math.max(0,Number(DEMO_DB.stats.topics)||0)+1;
  DEMO_DB.stats.messages=Math.max(0,Number(DEMO_DB.stats.messages)||0)+(copy.posts||[]).length;
  const c=DEMO_DB.categories.find(function(x){return x.name===copy.category});if(c){c.topics=(Number(c.topics)||0)+1;c.messages=(Number(c.messages)||0)+(copy.posts||[]).length;}
  persist();alert("Копия темы создана");
}

function newUserForm(){window.__editingUserId=null;previewTarget="index.html?preview=1";panel().innerHTML='<h2>Новый пользователь</h2>'+field("nuName","Имя","DemoUser")+field("nuRole","Роль","Участник")+field("nuRating","Рейтинг",0,"number")+field("nuAvatar","Аватар","D")+field("nuColor","Цвет","#65745c")+field("nuJoined","Дата",todayStr())+textarea("nuBio","Биография","Синтетический профиль.")+`<button class="gold-btn" onclick="createUser()">Создать пользователя</button>`}

function deleteUser(id){
  if(DEMO_DB.users.length<=1)return alert("Нельзя удалить последнего пользователя");
  if(Number(id)===Number(localStorage.getItem("PROBIV_USER_ID")))return alert("Нельзя удалить текущего активного пользователя");
  const target=DEMO_DB.users.find(function(u){return u.id!==id});
  if(!target)return;
  const refs=(DEMO_DB.threads||[]).filter(function(t){return Number(t.author)===Number(id)||t.posts.some(function(p){return Number(p.user)===Number(id)})});
  const msg=refs.length
    ?"У пользователя есть темы или сообщения. При удалении автор будет заменён на «"+target.name+"», чтобы не сломать связи. Продолжить?"
    :"Удалить пользователя?";

}

async function setAccess(id,v){const t=getThread(id);if(!t)return;const previous=t.guestAccess;t.guestAccess=v;const result=await persist();if(!result?.ok){t.guestAccess=previous;render();alert("Доступ не сохранён в Supabase: "+(result?.reason||"ошибка сохранения"));return;}const verified=await window.SupabaseAdapter.verifyTopic(id,v,t.title);if(!verified.ok){t.guestAccess=previous;render();alert("Доступ не подтверждён базой: "+verified.reason);return;}alert(v==="invite"?"Тема закрыта для гостей. Supabase подтвердил доступ только авторизованным.":"Тема открыта для гостей. Supabase подтвердил изменение.");}

function importDB(){const f=document.getElementById("importFile").files[0];if(!f)return alert("Выберите JSON-файл резервной копии");const r=new FileReader();r.onerror=()=>alert("Не удалось прочитать файл");r.onload=()=>{let x;try{x=JSON.parse(r.result)}catch(e){return alert("Файл не является корректным JSON: "+e.message)}
 if(!x||typeof x!=="object"||Array.isArray(x)||!Array.isArray(x.threads)||!Array.isArray(x.users)||!Array.isArray(x.categories))return alert("Это не резервная копия PROBIV: нужны массивы users, threads и categories.");

 delete x.adminAuth;delete x._meta;
 try{localStorage.setItem("PROBIV_DEMO_DB",JSON.stringify(x));localStorage.setItem("PROBIV_DB_VERSION",window.DEMO_DB_VERSION||"v9");sessionStorage.removeItem("PROBIV_PREVIEW_DB")}catch(e){return alert("Не удалось записать данные (localStorage переполнен?): "+e.message)}
 location.reload()};r.readAsText(f)}
